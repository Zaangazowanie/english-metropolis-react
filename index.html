<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The brand mark is now the illustrated Bajla plate, which has no vector
         form, so the SVG favicon link is gone (the file stays for reference).
         Browsers prefer an SVG icon when one is offered and would keep serving
         the retired "M." mark from cache. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Facebook domain verification. This lived only in the DEPLOYED
         index.html, which is a build artifact — so the 2026-08-26 09:14 deploy
         regenerated the file and silently dropped it. It belongs in the SOURCE
         template, which is the only copy a build cannot overwrite. -->
    <meta name="facebook-domain-verification" content="tp4v6h9zvvjclsyok8xcewez508lov" />
    <title>English Metro.</title>
    <!-- PWA / Add-to-home-screen — Mike's new logo + brand name 2026-04-25 -->
    <meta name="theme-color" content="#A21CAF" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#120929" media="(prefers-color-scheme: dark)"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="English Metro."/>
    <meta name="application-name" content="English Metro."/>
    <link rel="manifest" href="/manifest.webmanifest?v=4"/>
    <!-- iOS picks the ONLY apple-touch-icon link with sizes; we explicitly drop
         the legacy /apple-touch-icon.png reference so iOS doesn't fall back to
         the stale icon. ?v=4 cache-bust forces refetch. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-apple-180.png?v=4"/>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4"/>
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=4"/>
    <!-- Link previews (WhatsApp, X, Messenger) had no image, so a shared link
         rendered as a bare grey card. They show the wordmark now. -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="English Metro."/>
    <meta property="og:title" content="English Metro. — live 1:1 English lessons"/>
    <meta property="og:description" content="Big-city English with a real teacher. Live 1:1 lessons, lesson notes after every session, and practice that fits your week."/>
    <meta property="og:url" content="https://englishmetro.com/"/>
    <meta property="og:image" content="https://englishmetro.com/brand/em-og-card.jpg?v=1"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="English Metro. — live 1:1 English lessons"/>
    <meta name="twitter:description" content="Big-city English with a real teacher. Live 1:1 lessons, lesson notes after every session, and practice that fits your week."/>
    <meta name="twitter:image" content="https://englishmetro.com/brand/em-og-card.jpg?v=1"/>
    <script>
      // Tell the conversa widget which student it's talking to,
      // and skip mounting it entirely on the public marketing/login pages.
      (function() {
        var path = window.location.pathname;
        var m = path.match(/^\/app\/([^\/]+)/) || path.match(/^\/admin\/students\/([^\/]+)/);
        window.__STUDENT_SLUG = m ? m[1] : null;
        window.__EM_ADMIN_MODE = /^\/admin\//.test(path);
        // One definition of "the tutor does not belong here", exported so the
        // SPA can re-apply it on every client-side navigation. Deciding once at
        // load is not enough: React changes the path without reloading, so
        // arriving at the homepage from the dashboard used to carry the widget
        // onto a page this rule says it must not appear on.
        window.__EM_TUTOR_HIDDEN_ON = function (p) {
          return (p === '/' || p === '/login' ||
                  /^\/(lessons|pricing|signup|privacy|cookies|terms)\/?$/.test(p));
        };
        window.__EM_HIDE_TUTOR = window.__EM_TUTOR_HIDDEN_ON(path);
        // Two-letter country from Cloudflare, substituted by nginx (sub_filter
        // on $http_cf_ipcountry) at request time. The site stays Polish-first;
        // this only lets a visitor outside Poland land on English instead of
        // having to find the toggle. A saved preference always beats it.
        // If the substitution ever fails the placeholder arrives verbatim,
        // which src/i18n rejects and treats as Poland.
        window.__EM_GEO_COUNTRY = '__EM_GEO__';
      })();
    </script>

    <!-- Fonts — self-hosted (GDPR: no IP transfer to Google). The site's CSP
         (font-src 'self') blocks Google Fonts entirely, so external links
         silently fall back to system fonts. Mirrored via selfhost_fonts.py. -->
    <link href="/fonts/fonts.css" rel="stylesheet">

    <!-- v3 design-system keyframes (AuroraBG, Shimmer, etc.) + mobile/PWA CSS -->
    <style>
      /* App-feel on mobile / standalone */
      body {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior-y: none;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }
      * { -webkit-overflow-scrolling: touch; }
      button, nav, [role="button"] { -webkit-user-select: none; user-select: none; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      .em-safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 12px); }
      .em-safe-top    { padding-top: max(env(safe-area-inset-top), 0px); }
      :focus:not(:focus-visible) { outline: none; }
      @media (display-mode: standalone) {
        body { overscroll-behavior: none; }
      }
      @keyframes emAurora {
        0%, 100% { transform: translate(0,0) scale(1); }
        33% { transform: translate(30px,-20px) scale(1.1); }
        66% { transform: translate(-20px,30px) scale(0.95); }
      }
      @keyframes emShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes emFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes emFadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes emModalIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      @keyframes emPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .v3-nav-scroll::-webkit-scrollbar { display: none; }
    </style>

    <!-- Material Symbols — self-hosted (GDPR). Google's css2 helper class omits
         font-feature-settings:'liga', so icons render as raw ligature text
         (expand_more, settings_voice…). The self-hosted CSS sets 'liga'. -->
    <!-- Outlined + Rounded both defined here (Rounded used by .conversa-admin). -->
    <link href="/fonts/material-symbols.css" rel="stylesheet">


    <!-- jsPDF (365 KB) is loaded on demand by src/utils/pdf-loader.js when a
         student clicks a PDF button. It used to be eagerly loaded here on EVERY
         page, including the landing, and the vendor file had been missing from
         the webroot since May 2026, so every page logged a 404 (2026-09-03). -->
    <!-- Google Identity Services — powers the new "Sign in with Google" button
         on /login. Additive auth: existing email+password studentLogin still
         works untouched. The button is rendered via google.accounts.id.* in
         src/views/v3/Login.jsx; this script just exposes window.google. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="font-body text-on-surface min-h-screen selection:bg-primary-fixed-dim">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Home-page hero motion overlay: the small skyline sketch, the cloud/star
         field and the light beam. Hand-written vanilla files in /public/assets,
         not React, and they used to be injected by hand straight into the
         DEPLOYED index.html. That file is a BUILD ARTIFACT, so the 2026-08-26
         09:14 deploy regenerated it and the whole overlay vanished from the home
         page — while all four assets carried on being served 200. Declaring them
         in the SOURCE template is the fix: a build can no longer drop what the
         template asks for.

         ⛔ THE STYLESHEET MUST STAY HERE, AT THE END OF <body>, NOT IN <head>.
         Vite appends the app's own index-*.css to <head> at build time, so any
         <head> link of ours would load BEFORE it and lose every specificity tie.
         The last-good deployed file had this link at line 190, immediately after
         the app sheet, for exactly that reason. Document order is the only
         mechanism available here, since we cannot place a tag after one vite
         has not written yet. -->
    <link rel="stylesheet" href="/assets/em-motion-20260825-v3.css?v=29">
    <script defer src="/assets/em-motion-20260825-v3.js?v=17"></script>
    <!-- Conversa AI Tutor — loaded on student/admin app pages only.
         ?v=2 busts Cloudflare's cached 404 from when the widget wasn't
         on the prod webroot (pre-2026-04-21). -->
    <script>
      if (!window.__EM_HIDE_TUTOR) {
        var s = document.createElement('script');
        s.src = '/students/conversa-widget-v5.js?v=motion-20260903';
        s.defer = true;
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
