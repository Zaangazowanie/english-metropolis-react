name: game3d-gate
# Auto-gate every Fluent City 3D game PR: contract budgets must hold.
# Mirrors the pricemate-engine golden-harness pattern (2026-06-12).
on:
  pull_request:
    paths:
      - 'src/practice/shells3d/**'
      - 'public/games/**'
      - 'docs/game3d/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (lockfile-pinned)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Budget gate
        env:
          GAME3D_BASE: origin/${{ github.base_ref }}
        run: node scripts/game3d-budget-check.mjs
