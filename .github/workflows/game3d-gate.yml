name: game3d-gate
# Auto-gate every Fluent City 3D game PR: contract budgets must hold.
# Mirrors the pricemate-engine golden-harness pattern (2026-06-12).
#
# 2026-06-20 (Builder): extended the path filter to cover the WorldKit
# (src/world/**) and gate tooling (scripts/**, this workflow), and added an
# ADVISORY gameplay-capture step that records the demo flow as a GIF in CI and
# posts it to the PR. Capture is continue-on-error and the script exits 0 on any
# failure — it can NEVER red-gate a build+budget-green PR.
on:
  pull_request:
    paths:
      - 'src/practice/shells3d/**'
      - 'src/world/**'
      - 'public/games/**'
      - 'public/world/**'
      - 'docs/game3d/**'
      - 'scripts/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/game3d-gate.yml'

jobs:
  budget:
    runs-on: ubuntu-latest
    # contents: write → commit the captured GIF to the PR branch.
    # pull-requests: write → post the GIF as a PR comment.
    # (The budget gate itself only reads; these are for the advisory capture.)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (lockfile-pinned)
        run: npm ci
      - name: Mechanics regression tests
        run: |
          node --test \
            tests/arcade-run.test.mjs \
            tests/arcade-entry.test.mjs \
            tests/arcade-demo-progress.test.mjs \
            tests/action-arcade-logic.test.mjs \
            tests/challenge-arcade.test.mjs \
            tests/challenge-machine.test.mjs \
            src/practice/shells/word-arcade-mechanics.test.mjs \
            src/practice/shells/word-arcade-crossword.test.mjs \
            src/practice/shells3d/word-kit/mechanics.test.mjs \
            src/practice/shells3d/word-kit/demo-layout.test.mjs \
            tests/lesson-metro-scene.test.mjs \
            tests/bajla-tour.test.mjs
      - name: Build
        run: npm run build
      - name: Budget gate
        env:
          GAME3D_BASE: origin/${{ github.base_ref }}
        run: node scripts/game3d-budget-check.mjs

      # ── ADVISORY gameplay capture (never gates the PR) ──────────────────────
      # Everything below is continue-on-error; the capture script also exits 0
      # on any internal failure. A capture problem must not fail a green PR.
      - name: Map englishmetro hostname (CI-only)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: echo "127.0.0.1 local.englishmetro.com" | sudo tee -a /etc/hosts
      - name: Install Playwright (workflow-level — not a repo dependency)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Capture gameplay GIF (advisory)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: node scripts/game3d-capture.mjs
      - name: Upload capture artifact
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-capture
          path: .capture-out/*.gif
          if-no-files-found: ignore
      - name: Commit GIF to PR + comment
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const metaPath = '.capture-out/meta.json'
            if (!fs.existsSync(metaPath)) { core.info('no capture meta — nothing to publish'); return }
            const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'))
            if (!meta.gif || !fs.existsSync(meta.gif)) { core.info('no gif produced'); return }

            const { owner, repo } = context.repo
            const pr = context.payload.pull_request
            const headRef = pr.head.ref
            const sameRepo = pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`
            const dest = `docs/game3d/captures/${meta.shellKey}.gif`
            const content = fs.readFileSync(meta.gif).toString('base64')

            let rawUrl = null
            if (sameRepo) {
              // Commit the GIF to the PR head branch ([skip ci] avoids a loop).
              let sha
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: dest, ref: headRef })
                sha = data.sha
              } catch { /* new file */ }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: dest, branch: headRef, content, sha,
                message: `chore(capture): gameplay GIF for ${meta.shellKey} [skip ci]`,
              })
              rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${headRef}/${dest}`
            }

            const body = rawUrl
              ? `### 🎬 Gameplay capture (auto)\n\n![${meta.shellKey} gameplay](${rawUrl})\n\n` +
                `_Recorded in CI: home → Enter the City → Begin → Wren walking. ` +
                `Advisory — never gates the build. Also attached as the \`gameplay-capture\` artifact._`
              : `### 🎬 Gameplay capture (auto)\n\nCaptured GIF is attached as the \`gameplay-capture\` ` +
                `CI artifact (fork PR — cannot commit to the head branch). Advisory — never gates the build.`

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number })
            const mine = comments.find((c) => c.body && c.body.includes('Gameplay capture (auto)'))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })

